name = "skucoverage-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "skucoverage-prod"
database_id = "25c19793-a518-4f1b-8c56-69ca9ef60417"

[[r2_buckets]]
binding = "R2"
bucket_name = "skucoverage-files"


[vars]
CSV_URL_TTL_SECONDS = "604800"
CORS_ORIGIN = "https://app.skucoverage.com,https://skucoverage.com,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
BREVO_SENDER_EMAIL = "noreply@skucoverage.com"

[triggers]
crons = ["0 8 * * 1"]
