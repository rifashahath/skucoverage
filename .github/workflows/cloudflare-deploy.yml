name: Deploy to Cloudflare

# One push to main deploys both Cloudflare projects:
#   1. the API Worker skucoverage121 (repo root, wrangler.toml)
#   2. the static frontend to the Pages project skucoverage-web
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - custom token with Workers Scripts:Edit and Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID - the account that owns the skucoverage.tech zone

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  worker:
    name: Deploy API Worker (skucoverage121)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        run: npx wrangler deploy

  pages:
    name: Build and deploy frontend (Pages project skucoverage-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skufrontend/app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix skufrontend/app ci

      - name: Build frontend into cloudflare-pages/app
        run: npm run build:app
        env:
          VITE_API_BASE_URL: https://api.skucoverage.tech
          VITE_SUPABASE_URL: https://rpogcdhsxmqlrzppqnmo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Dy1CrhUzq4wnXQgYxVWR5w_DXyPFDfh

      - name: Create the Pages project if it does not exist
        run: npx wrangler pages project create skucoverage-web --production-branch main || echo "Pages project already exists - continuing"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy cloudflare-pages --project-name skucoverage-web --branch main --commit-dirty=true
