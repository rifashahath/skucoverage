<svg xmlns="http://www.w3.org/2000/svg" width="303" height="246" fill="none">
  <foreignObject width="360.016" height="305.04" x="-29.078" y="-30">
    <div xmlns="http://www.w3.org/1999/xhtml" style="backdrop-filter:blur(15px);clip-path:url(#cardClip);height:100%;width:100%"/>
  </foreignObject>
  <g data-figma-bg-blur-radius="30">
    <rect width="300.016" height="245.04" x=".922" fill="#fff" fill-opacity=".5" rx="16"/>
    <rect width="299.016" height="244.04" x="1.422" y=".5" stroke="#fff" stroke-opacity=".8" rx="15.5"/>
  </g>

  <!-- Badges Top Right -->
  <!-- Score Badge -->
  <rect width="46" height="20.276" x="190" y="18.782" fill="#0CC33D" rx="10.138"/>
  <text x="213" y="32.8" text-anchor="middle" fill="#fff" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="10.5">Score</text>

  <!-- +34% Badge -->
  <rect width="45" height="20.276" x="242" y="18.782" fill="#1D1D1D" rx="10.138"/>
  <text x="264.5" y="32.8" text-anchor="middle" fill="#fff" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="10.5">+34%</text>

  <!-- Subtle Horizontal Grid Lines -->
  <line x1="28" y1="80" x2="275" y2="80" stroke="#FFFFFF" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <line x1="28" y1="120" x2="275" y2="120" stroke="#FFFFFF" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="28" y1="160" x2="275" y2="160" stroke="#FFFFFF" stroke-opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Smooth Upward Health Score Curve -->
  <!-- Area gradient under curve -->
  <path d="M 36 170
           C 75 168, 100 155, 130 140
           C 165 122, 195 105, 225 88
           C 242 79, 255 75, 266 75
           L 266 210
           L 36 210
           Z"
        fill="url(#chartAreaFill)"/>

  <!-- Curve Stroke -->
  <path d="M 36 170
           C 75 168, 100 155, 130 140
           C 165 122, 195 105, 225 88
           C 242 79, 255 75, 266 75"
        fill="none"
        stroke="url(#chartStroke)"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Milestone Dots along curve -->
  <!-- 64% Baseline (Jan) -->
  <circle cx="36" cy="170" r="3.5" fill="#3B82F6" stroke="#fff" stroke-width="2"/>
  <rect x="22" y="180" width="28" height="15" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
  <text x="36" y="191" text-anchor="middle" fill="#2563EB" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="9">64%</text>

  <!-- Mid points -->
  <circle cx="130" cy="140" r="2.5" fill="#3B82F6" stroke="#fff" stroke-width="1.5"/>
  <circle cx="205" cy="100" r="2.5" fill="#3B82F6" stroke="#fff" stroke-width="1.5"/>

  <!-- 98% Peak Dot (Jun) with glowing rings -->
  <circle cx="266" cy="75" r="10" fill="#3B82F6" fill-opacity="0.18"/>
  <circle cx="266" cy="75" r="6" fill="#2563EB" fill-opacity="0.35"/>
  <circle cx="266" cy="75" r="3.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>

  <!-- 98% Clean Callout Badge (Positioned left of the peak dot) -->
  <g transform="translate(196, 52)">
    <rect width="58" height="20" rx="6" fill="#1E293B" />
    <polygon points="58,10 63,13 58,16" fill="#1E293B" />
    <text x="29" y="13.5" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="9.5">98% Clean</text>
  </g>

  <!-- Month X-Axis Labels -->
  <g fill="#475569" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.5">
    <text x="36" y="222" text-anchor="middle">JAN</text>
    <text x="82" y="222" text-anchor="middle">FEB</text>
    <text x="128" y="222" text-anchor="middle">MAR</text>
    <text x="174" y="222" text-anchor="middle">APR</text>
    <text x="220" y="222" text-anchor="middle">MAY</text>
    <text x="266" y="222" text-anchor="middle">JUN</text>
  </g>

  <defs>
    <linearGradient id="chartAreaFill" x1="150" y1="75" x2="150" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#406AE4" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#406AE4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#406AE4" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chartStroke" x1="36" y1="170" x2="266" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <clipPath id="cardClip" transform="translate(29.078 30)">
      <rect width="300.016" height="245.04" x=".922" rx="16"/>
    </clipPath>
  </defs>
</svg>