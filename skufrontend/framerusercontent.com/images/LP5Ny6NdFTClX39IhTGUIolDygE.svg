<svg xmlns="http://www.w3.org/2000/svg" width="304" height="280" viewBox="0 0 304 280" fill="none">
  <!-- Card Background -->
  <rect width="304" height="280" rx="20" fill="#FFFFFF"/>
  <rect width="303" height="279" x="0.5" y="0.5" rx="19.5" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ROW 1: Checked Products: 1,420 SKUs -->
  <g transform="translate(18, 22)">
    <!-- Icon Container -->
    <rect width="42" height="42" rx="10" fill="#F1F5F9" />
    <!-- Box / Catalog SVG Icon -->
    <path d="M21 11 L31 16 L21 21 L11 16 Z M11 18 L21 23 L21 31 L11 26 Z M31 18 L21 23 L21 31 L31 26 Z" 
          fill="#3B82F6" stroke="#2563EB" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Text Group -->
    <text x="52" y="18" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="11">Checked Products</text>
    <text x="52" y="36" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="-0.3">1,420 SKUs</text>

    <!-- Right Badge -->
    <rect x="208" y="10" width="58" height="22" rx="11" fill="#F0FDF4" />
    <text x="237" y="25" text-anchor="middle" fill="#16A34A" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="10.5">+100%</text>
  </g>

  <!-- Divider 1 -->
  <line x1="20" y1="84" x2="284" y2="84" stroke="#F1F5F9" stroke-width="1"/>

  <!-- ROW 2: Clean Variants: 98.4% -->
  <g transform="translate(18, 102)">
    <!-- Icon Container -->
    <rect width="42" height="42" rx="10" fill="#F1F5F9" />
    <!-- Checkmark Badge Icon -->
    <path d="M21 13 C26 13 30 16 30 21 C30 26 26 30 21 30 C16 30 12 26 12 21 C12 16 16 13 21 13 Z" fill="#10B981" fill-opacity="0.15"/>
    <path d="M16.5 21.5 L19.5 24.5 L25.5 17.5" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Text Group -->
    <text x="52" y="18" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="11">Clean Variants</text>
    <text x="52" y="36" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="-0.3">98.4%</text>

    <!-- Right Badge -->
    <rect x="208" y="10" width="58" height="22" rx="11" fill="#F0FDF4" />
    <text x="237" y="25" text-anchor="middle" fill="#16A34A" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="10.5">+5.2%</text>
  </g>

  <!-- Divider 2 -->
  <line x1="20" y1="164" x2="284" y2="164" stroke="#F1F5F9" stroke-width="1"/>

  <!-- ROW 3: Google Feed Sync -->
  <g transform="translate(18, 182)">
    <!-- Icon Container -->
    <rect width="42" height="42" rx="10" fill="#F1F5F9" />
    <!-- Shopping Tag / Barcode Icon -->
    <path d="M16 15 L24 15 L28 19 L20 27 L16 23 Z" fill="#6366F1" fill-opacity="0.2"/>
    <circle cx="20" cy="18" r="1.5" fill="#4F46E5"/>
    <path d="M15 26 L17 28 M18 23 L23 28 M22 21 L26 25" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Text Group -->
    <text x="52" y="18" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="11">Google Merchant Sync</text>
    <text x="52" y="36" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="15" letter-spacing="-0.3">0 Feed Errors</text>

    <!-- Right Badge -->
    <rect x="208" y="10" width="58" height="22" rx="11" fill="#EFF6FF" />
    <text x="237" y="25" text-anchor="middle" fill="#2563EB" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="10.5">Active</text>
  </g>
</svg>